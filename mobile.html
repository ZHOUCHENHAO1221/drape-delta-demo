*{margin:0;padding:0;box-sizing:border-box}
:root{--sans:"Geist","Helvetica Neue",Arial,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
html{-webkit-font-smoothing:antialiased;overscroll-behavior:none;height:100%;overflow:hidden}
body{font-family:var(--sans);height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;display:flex;justify-content:center;align-items:flex-start;padding:0;background:#0c0d0f;transition:background .35s}
body.dark{background:#0a0a0b}
body:not(.entered) #tg{display:none}
.toggle{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(18px,calc(50% - 222px));z-index:40;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:#3a3d42;background:#fff;border:1px solid #dcdee1;padding:7px 12px;border-radius:22px;cursor:pointer;box-shadow:0 6px 20px -10px rgba(0,0,0,.3);user-select:none}
body.dark .toggle{background:#17181b;border-color:#2a2c31;color:#c9cbd0}
.toggle .sw{width:32px;height:17px;border-radius:20px;background:#d4d6d9;position:relative}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s}
body.dark .toggle .sw{background:#2ee06a}body.dark .toggle .sw::after{transform:translateX(15px)}
/* phone */
.phone{width:100%;max-width:480px;padding:0;border-radius:0;background:none;box-shadow:none}
.app{--bg:#f5f6f8;--card:#fff;--ink:#0b0d0f;--ink2:#767b82;--line:#eceef1;--green:#16a34a;--greenSoft:#e9f7ee;--track:#eef0f3;
  position:relative;border-radius:0;overflow:hidden;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;transition:background .35s,color .35s}
.app.dark{--bg:#0c0d0f;--card:#161a1e;--ink:#f3f4f6;--ink2:#8b9098;--line:#262a30;--green:#2ee06a;--greenSoft:rgba(46,224,106,.13);--track:#20242a}
.island{display:none;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:27px;background:#000;border-radius:16px;z-index:30}
.status{display:none;height:48px;flex:0 0 auto;align-items:center;justify-content:space-between;padding:0 26px;font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink)}
.status .r{display:flex;align-items:center;gap:6px}.status svg{width:17px;height:17px;color:var(--ink)}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.scr::-webkit-scrollbar{display:none}
.pad{padding:6px 20px 24px}
.tabbar{flex:0 0 auto;height:66px;display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--ink2);font-family:var(--sans);font-size:9px;font-weight:500;cursor:pointer;transition:color .15s}
.tabbar button.on{color:var(--green)}.tabbar svg{width:22px;height:22px}
/* generic */
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.lead{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:14px}
.disc{flex:0 0 auto;padding:7px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:8px;color:var(--ink2);line-height:1.45;text-align:center;background:var(--card)}
.hdr{display:flex;align-items:center;gap:10px;margin:4px 0 12px;padding-right:163px}
.hdr .bk{width:32px;height:32px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px -8px rgba(0,0,0,.4);color:var(--ink)}
.hdr h1{margin:0;min-width:0}
.seg{display:flex;background:var(--track);border-radius:11px;padding:4px;margin-bottom:15px}
.seg button{flex:1;border:0;background:transparent;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink2);padding:9px;border-radius:8px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.3)}
.rank{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:12px;cursor:pointer;transition:background .18s}.row:active{background:var(--card)}
.dot{width:22px;height:22px;border-radius:7px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.row .nm{flex:0 0 88px;font-size:12px;font-weight:500;line-height:1.15}.row .nm .u{display:block;font-family:var(--mono);font-size:9px;color:var(--ink2)}
.bw{flex:1;height:26px;background:var(--track);border-radius:8px;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--green);transition:width .6s cubic-bezier(.3,.8,.3,1)}
.bv{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.3)}.bv.out{color:var(--ink);right:auto;text-shadow:none}
.ins{margin-top:15px;padding:12px 14px;border-radius:13px;background:var(--greenSoft);font-size:12px;line-height:1.5}.ins b{color:var(--green)}
.ba{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:#0b0b0d;user-select:none;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ba .ti{clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0)}
.ba .lab{position:absolute;top:10px;font-family:var(--mono);font-size:9.5px;padding:4px 8px;border-radius:20px;color:#fff;background:rgba(10,10,12,.6)}.ba .lab.l{left:10px}.ba .lab.r{right:10px;background:var(--green)}
.ba .dv{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:#fff}
.ba .kn{position:absolute;top:50%;left:var(--pos,50%);width:36px;height:36px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 3px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:14px;color:#111;cursor:ew-resize}
.hint{text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--ink2);margin-top:7px}
.heroseg{margin-bottom:12px}
.heat{border-radius:18px;overflow:hidden;background:#0b0b0d;display:flex;justify-content:center;box-shadow:0 14px 34px -24px rgba(0,0,0,.6)}
.heat img{width:100%;max-width:300px;height:auto;display:block}
.heat3d{border-radius:18px;overflow:hidden;background:#0b0d0f;position:relative;height:min(120vw,44vh);height:min(120vw,44dvh);box-shadow:0 14px 34px -24px rgba(0,0,0,.6)}
.hcanvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.heroseg button{font-size:11px;padding:9px 4px;line-height:1.2}
.fig{background:#fff;border-radius:14px;padding:9px;box-shadow:0 8px 22px -20px rgba(0,0,0,.5);margin-top:8px}
.fig img{width:100%;display:block;border-radius:6px}
.prov{background:var(--card);border-radius:13px;padding:6px 14px;margin-top:8px;box-shadow:0 8px 22px -20px rgba(0,0,0,.5)}
.prow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.prow:last-child{border-bottom:0}

function methods(){const s=[["1","Physical fabric","7 specimens · 6 specs (P31/P32 same spec, separately dyed)"],["2","Measure to ISO procedures","mass ISO 3801 · thickness ISO 5084 · tensile ISO 13934-1 · n=5 · conditioning departure declared"],["3","Calibrate into CLO3D","bending calibrated to a 41.5° cantilever chord; stretch from 5% secant"],["4","Measured .zfab","7 calibrated files, loadable in CLO3D"]];

  <div class="pipe">${s.map(x=>`<div class="pstep"><div class="n">${x[0]}</div><div><div class="tt">${x[1]}</div><div class="dd">${x[2]}</div></div></div>`).join('')}</div>
  <div class="sect">Why measuring matters</div>
  <div class="fig"><img alt="Chart: how strongly each of the seven measured fabrics resists a low-load stretch, compared with the value the CLO library presets supply. Tap or click to enlarge." src="${((new URLSearchParams(location.search).get('lang')||(window.localStorage&&localStorage.getItem('drape_lang')))==='zh')?CHART_ZH:CHART}"></div>
  <div class="hint">ISO 13934-1 tensile · low-load response · 5% secant stiffness → CLO stretch index · a proxy, not a standard stretch test</div>
  <div class="mod"><div class="t">How &Delta; is computed</div><div class="li"><b style="white-space:nowrap">Garment &Delta;</b> = mean per-vertex absolute displacement between the library-preset run and the measured-input run, within the same CLO3D garment scenario.</div><div class="li">Specimen level: each fabric's G1 / G2 &Delta; is that mean over the garment mesh (e.g. P15 G1 = 95 mm). Dataset level: 24.5 / 10.1 mm are the means of the seven specimen-level values (G1 median 12.0 mm).</div></div>

  <div class="mod"><div class="t">Held against cloth</div><div class="li">Seven fabrics were draped on a self-built Cusick-style rig — 3 specimens × 2 faces each — and the drape coefficient compared against the same seven simulated from measured input and from library presets. The rig is not a certified Cusick instrument.</div><div class="li">Order: measured input ranks with the cloth (Spearman 0.964); the presets do not (0.286). Amount: mean absolute error 0.106 against 0.116. Measured is closer on 3, level on 2 and further on 2, counting as level any fabric where the two arms differ by less than that fabric’s own spread across its six readings (P06, 0.002 against a spread of 0.041; P15, 0.015 against 0.022) — both arms are still far from the cloth.</div><div class="li">P31 and P32 are one cloth in two colourways. Physically they differ by 0.202. The library preset gives them the same coefficient, 0.0001 apart. Measured input separates them by 0.007 — it does not recover the difference either.</div><div class="li">This bounds the note at the foot of every page; it does not lift it. One rig, seven fabrics, one engine — the deltas in this library stay preset-vs-measured, not errors against physical reality.</div></div>

  <div class="mod"><div class="t">Taking the data away</div><div class="li">Export writes one row per specimen, and every row carries its own material record (version, calibration route, date) and measurement record (method, sample size, test house, declared departures).</div><div class="li">The CSV export runs on the desktop panel. The two shells hold different fields, so a phone export would produce different columns — one export, one schema.</div><div class="li">Provenance is exported exactly as it was declared — this deployment does not verify it.</div></div>
  <div class="mod"><div class="t">Re-running this comparison</div><div class="li">Everything needed is on this page: the measured .zfab (download it from the fabric card), the named library preset, both garment scenarios, the engine build, the particle distance and the fitting mode.</div><div class="li">Method: build your own garment, apply the library preset and simulate, export the mesh; apply the measured .zfab to the same garment and simulate again, export; compare the two meshes vertex by vertex.</div><div class="li"><b>You cannot reproduce these exact numbers.</b> The garment engineering files are not distributed, and a delta belongs to the garment it was measured on — what transfers is the method, not the millimetres.</div><div class="li"><b>A different CLO version is a different engine.</b> Results from another build must be reported separately, not merged into this record.</div></div>
  <div class="mod"><div class="t">Design rule</div><div class="li">Measure bending for drape-dominant garments; measure stretch for any knit or elastic fabric, whatever the silhouette.</div><div class="li">Stretch differences survive fitting: the knit still differs by 48.8 mm on the fitted H-line, 51% of its drape figure.</div><div class="li">Bending differences largely do not — five bending-driven fabrics fall to 16–36%. Their fitted Δ is 2.2–4.3 mm, inside the ~10 mm per-vertex solver repeatability band, so those ratios are indicative only; and the chiffon does not follow the pattern at all — it retains 55%, the highest in the set, above the knit's 51%.</div></div>

function about(){scr.innerHTML=`<div class="pad"><h1>About</h1>
  <div class="mod"><div class="t">What this is</div><div class="li">DRAPE △ is a measured digital-material workspace: it organises fabric that has been physically measured and shows how far a named CLO library preset sits from that measured input.</div><div class="li">Laboratory measurement of cloth is mature; entering those measurements into a garment simulator is not. For each CLO3D input this workspace records whether the value could be entered directly from a physical measurement, through a proxy, through calibration against a physical reference, or not at all — and what that difference does to a simulated garment. The record travels with every fabric here. v1 demonstrates one intake channel end-to-end; the rest are designed concepts.</div></div>
  <div class="mod"><div class="t">Whose workspace</div><div class="li">This prototype represents the private measured-material workspace of a fictional brand product-development team. The dataset is seven specimens measured and digitised within this project.</div></div>
  <div class="mod"><div class="t">How to read the numbers</div><div class="li">Read a delta as a match statement — the library fabric is not a match to the fabric you are hoping to use.</div><div class="li">Every value is a within-CLO3D delta between a named library preset and the measured input — not an error against physical reality.</div><div class="li">Single solver (CLO3D 2026.0.374, PD 10), two garment scenarios (G1 drape, G2 fitted), no physical ground-truth validation.</div><div class="li">Library preset thickness is a constant 0.50 mm CLO placeholder — part of each thickness gap reflects this default, not a class value.</div><div class="li">Property-isolation evidence is available only for P15 and P28.</div><div class="li">Preset baselines are manually chosen CLO library references, not equivalent physical fabrics — a delta is not an error against a naturally correct baseline.</div><div class="li">A measured value is a known reference point, not a target — designers lower stiffness on purpose to exaggerate drape. Closer to measured is not automatically the better-looking garment.</div></div>
  <div class="mod"><div class="t">Form</div><div class="li">This v1 runs as a standalone web app; the working form is a panel that docks inside the CLO3D workflow (future integration).</div></div>
  <div class="mod"><div class="t">Credit</div><div class="li">Chenhao Zhou (He/Him) · London College of Fashion · UAL · 2026</div></div></div>`;}

function copyMobileLink(btn){
 // Same grammar the boot parser reads back: #a-<id> plus the hero view when it is not the
 // default. setHV keeps no state variable, so the current view is read back off the segment.
 var on = document.querySelector('.heroseg button.on');
 var hv = on ? String(on.id||'').replace('hs-','') : 'ba';
 var frag = V==='asset' ? ('#a-'+HFAB+(hv&&hv!=='ba'?('.'+hv):'')) : ('#'+(V||'materials'));
 var url = location.origin+location.pathname+frag;
 function done(ok){ if(!btn) return; var t=btn.title; btn.textContent = ok?'\u2713':'\u2717';
  setTimeout(function(){ btn.innerHTML='&#128279;'; btn.title=t; },1400); }
 function fallback(){ // no async clipboard outside a secure context - the common case on a phone over http
  try{ var ta=document.createElement('textarea'); ta.value=url;
   ta.style.cssText='position:fixed;opacity:0;left:-9999px';
   document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy');
   ta.remove(); done(ok); }catch(e){ done(false); } }
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(url).then(function(){done(true);},fallback);
 } else fallback();
}
