# DRAPE DELTA — live demo (static site + serverless functions + Netlify Blobs)
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Hourly liveness check: proves the read path still answers and keeps the free-tier
# Supabase project from being paused for inactivity. Writes to the function log.
[functions."heartbeat"]
  schedule = "@hourly"

# index.html is the CLO side-panel (primary). mobile.html is the phone companion.
[[redirects]]
  from = "/mobile"
  to = "/mobile.html"
  status = 200
